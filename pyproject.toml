[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hamjax"
version = "0.1.0"
description = "JAX & Hamiltonian mechanics: autodiff forces, symplectic integrators, lax.scan rollouts and Hamiltonian Neural Networks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11.4",
    "jaxtyping>=0.2.28",
]

[project.optional-dependencies]
examples = ["optax>=0.2", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "optax>=0.2", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hamjax"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# F722: jaxtyping shape strings; B008: Equinox modules are immutable, safe as defaults.
ignore = ["E741", "F722", "B008"]

[tool.ruff.lint.per-file-ignores]
# Notebooks enable float64 via jax.config before importing the rest.
"*.ipynb" = ["E402"]
